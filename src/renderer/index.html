<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>CareyMary</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="character" role="img" aria-label="CareyMary"></div>
    <button
      type="button"
      id="open-dashboard"

    <script src="./overlay.js"></script>
  </body>
</html>
